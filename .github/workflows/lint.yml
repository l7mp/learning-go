name: Lint Go codes

on:
  # push:
  #   paths:
  #     - '**.go'
  #     - 'go.mod'
  #     - 'go.sum'
  #   branches:
  #     - '*'
  #   tags-ignore:
  #     - '*'
  # pull_request:
  #   branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.repository == 'l7mp/learning-go'
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
